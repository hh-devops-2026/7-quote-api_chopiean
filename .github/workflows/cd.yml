name: CD

on:
    release:
        types: [published]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm test
            - name: Trigger Render deploy
              run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
